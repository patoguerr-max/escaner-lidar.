name: Compilar IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar el proyecto de Xcode
        run: xcodegen generate

      - name: Compilar (sin firma)
        run: |
          xcodebuild \
            -project EscanerLiDAR.xcodeproj \
            -scheme EscanerLiDAR \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Empaquetar el IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/EscanerLiDAR.app Payload/
          zip -r EscanerLiDAR.ipa Payload

      - name: Publicar el IPA
        uses: actions/upload-artifact@v4
        with:
          name: EscanerLiDAR-ipa
          path: EscanerLiDAR.ipa

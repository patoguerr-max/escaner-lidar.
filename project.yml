name: EscanerLiDAR
options:
  bundleIdPrefix: cl.escaner
  deploymentTarget:
    iOS: "17.0"
targets:
  EscanerLiDAR:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Escáner LiDAR
        NSCameraUsageDescription: La cámara y el sensor LiDAR se usan para escanear el entorno en 3D.
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities:
          - arkit
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cl.escaner.lidar
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
schemes:
  EscanerLiDAR:
    build:
      targets:
        EscanerLiDAR: all
    run:
      config: Release
    archive:
      config: Release
